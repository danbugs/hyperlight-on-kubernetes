apiVersion: v1
kind: Pod
metadata:
  name: hyperlight-unikraft-hello
  labels:
    app: hyperlight-unikraft-hello
    hypervisor: kvm
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  nodeSelector:
    hyperlight.dev/hypervisor: kvm
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: unikraft
      image: ${IMAGE}
      imagePullPolicy: Always
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        procMount: Default
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          hyperlight.dev/hypervisor: "1"
          memory: "256Mi"
          cpu: "500m"
        requests:
          hyperlight.dev/hypervisor: "1"
          memory: "128Mi"
          cpu: "100m"
